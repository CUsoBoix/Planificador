<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Un espacio sencillo para organizar tus tareas."
    />
    <title>Tareas — Planificador</title>
    <link
      rel="preload"
      href="./assets/fonts/inter-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./assets/vendor/ical.min.js" defer></script>
    <script src="./assets/vendor/supabase.min.js" defer></script>
    <script src="./cloud-config.js" defer></script>
    <script src="./assets/vendor/marked.min.js" defer></script>
    <script src="./assets/vendor/purify.min.js" defer></script>
    <script src="./file-rules.js" defer></script>
    <script src="./work-engine.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="./work-ui.js" defer></script>
  </head>
  <body>
    <main class="planner" aria-labelledby="page-title">
      <header class="page-header">
        <div class="page-heading">
          <p class="eyebrow">PLANIFICADOR</p>
          <h1 id="page-title">Tareas</h1>
        </div>
        <details class="options-menu" id="options-menu">
          <summary>Opciones</summary>
          <div class="options-panel">
            <section
              class="cloud-options"
              aria-label="Sincronización en la nube"
            >
              <p
                class="cloud-status"
                id="cloud-status"
                role="status"
                aria-live="polite"
              >
                Comprobando almacenamiento en la nube…
              </p>
              <div class="cloud-actions">
                <button
                  class="github-login"
                  id="github-login"
                  type="button"
                  hidden
                >
                  Iniciar sesión con GitHub
                </button>
                <button
                  class="github-logout"
                  id="github-logout"
                  type="button"
                  hidden
                >
                  Cerrar sesión
                </button>
              </div>
            </section>
            <div class="planner-options" id="planner-options" hidden>
              <button
                class="options-action"
                data-work-view="settings"
                type="button"
              >
                Configuración
              </button>
              <button class="options-action" id="import-calendar" type="button">
                Importar .ics
              </button>
              <input
                id="calendar-input"
                type="file"
                accept=".ics,text/calendar"
                hidden
              />
              <button
                class="options-action"
                id="remove-calendar"
                type="button"
                hidden
              >
                Quitar calendario
              </button>
              <button
                class="options-action"
                id="clear-completed"
                type="button"
                hidden
              >
                Archivar tareas completadas
              </button>
              <button
                class="options-action is-destructive"
                id="reset-all"
                type="button"
              >
                Restablecer todo
              </button>
            </div>
          </div>
        </details>
      </header>

      <div id="planner-content" hidden>
        <div class="planner-controls">
          <nav class="view-navigation" aria-label="Vistas del planificador">
            <button class="view-button" data-work-view="today" type="button">
              Hoy
            </button>
            <button
              class="view-button"
              data-planner-view="tasks"
              type="button"
              aria-pressed="true"
            >
              Tareas
            </button>
            <button class="view-button" data-work-view="projects" type="button">
              Proyectos
            </button>
            <button
              class="view-button"
              data-planner-view="week"
              type="button"
              aria-pressed="false"
            >
              Calendario
            </button>

            <button
              class="view-button"
              data-work-view="recurrences"
              type="button"
            >
              Recurrentes
            </button>
          </nav>
        </div>

        <div class="work-toolbar">
          <button id="new-work-task" type="button">+ Nueva tarea</button
          ><input
            id="work-search"
            type="search"
            placeholder="Buscar en tu trabajo…"
            aria-label="Búsqueda global"
          />
        </div>
        <section id="work-view" hidden></section>
        <section class="task-view" id="task-view" aria-label="Tareas">
          <div class="planner-toolbar">
            <h2 class="task-count" id="task-count" aria-live="polite">
              0 tareas pendientes
            </h2>
          </div>
          <form class="task-form" id="task-form" hidden>
            <label class="visually-hidden" for="task-input">Nueva tarea</label>
            <input
              id="task-input"
              name="task"
              type="text"
              maxlength="240"
              placeholder="¿Qué tienes que hacer?"
              autocomplete="off"
              required
            />
            <button
              class="add-button"
              type="submit"
              aria-label="Añadir tarea"
              title="Añadir tarea"
            >
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M10 4v12M4 10h12" />
              </svg>
            </button>
          </form>

          <section class="task-section" aria-label="Lista de tareas">
            <ul class="task-list" id="task-list"></ul>
            <p class="empty-state" id="empty-state">
              Tus tareas aparecerán aquí.
            </p>
          </section>
        </section>

        <section
          class="calendar-view"
          id="calendar-view"
          aria-label="Calendario de reuniones"
          hidden
        >
          <section class="meeting-section" aria-labelledby="meeting-title">
            <div class="meeting-heading">
              <div>
                <h2 id="meeting-title">Tu calendario</h2>
                <p class="meeting-count" id="meeting-count"></p>
              </div>
            </div>
            <p
              class="calendar-status"
              id="calendar-status"
              aria-live="polite"
              hidden
            ></p>
            <div
              class="calendar-view-switch"
              role="group"
              aria-label="Vista del calendario"
            >
              <button
                class="view-button"
                data-planner-view="week"
                type="button"
              >
                Semana</button
              ><button
                class="view-button"
                data-planner-view="month"
                type="button"
              >
                Mes
              </button>
            </div>
            <div class="calendar-toolbar">
              <div
                class="calendar-navigation"
                role="group"
                aria-label="Navegar por el calendario"
              >
                <button
                  class="calendar-nav-button"
                  id="calendar-previous"
                  type="button"
                  aria-label="Periodo anterior"
                >
                  ‹
                </button>
                <button
                  class="calendar-today"
                  id="calendar-today"
                  type="button"
                >
                  Hoy
                </button>
                <button
                  class="calendar-nav-button"
                  id="calendar-next"
                  type="button"
                  aria-label="Periodo siguiente"
                >
                  ›
                </button>
              </div>
              <h3 class="calendar-period" id="calendar-period"></h3>
            </div>
            <div class="calendar-scroll">
              <div
                class="calendar-grid is-week"
                id="calendar-grid"
                role="group"
                aria-label="Calendario de reuniones"
              ></div>
            </div>
            <div class="selected-agenda">
              <h3 class="selected-date" id="selected-date"></h3>
              <ul class="meeting-list" id="meeting-list"></ul>
            </div>
            <p class="meeting-empty" id="meeting-empty">
              Importa un archivo .ics de Outlook para ver tus reuniones.
            </p>
          </section>
        </section>
      </div>

      <p
        class="visually-hidden"
        id="announcements"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </main>
    <dialog id="work-dialog" aria-label="Ficha de trabajo"></dialog>
  </body>
</html>
